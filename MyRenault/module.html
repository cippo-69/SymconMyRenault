<style>
  :root {
    --mrn-surface: rgba(127,127,127,.12);
    --mrn-line: rgba(127,127,127,.25);
    --mrn-muted: rgba(127,127,127,1);
    --mrn-green: #2e9e5b;
    --mrn-amber: #e0a100;
    --mrn-red: #d23c3c;
    --mrn-blue: #2f7fd6;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; }
  #mrn { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: inherit;
         height: 100%; padding: 12px; display: flex; flex-direction: column; gap: 10px; overflow: auto; font-size: 14px; }
  /* Abstand oben: Symcon blendet links oben den Kachelnamen ein */
  .head { display: flex; align-items: center; gap: 8px; margin-top: 28px; }
  .head .title { font-weight: 600; font-size: 16px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .head .sub { font-size: 12px; color: var(--mrn-muted); }
  button { font: inherit; color: inherit; background: var(--mrn-surface); border: 1px solid var(--mrn-line);
           border-radius: 10px; padding: 8px 12px; cursor: pointer; transition: filter .15s, opacity .15s; }
  button:hover { filter: brightness(1.15); }
  button:disabled { opacity: .5; cursor: default; }
  button.primary { background: var(--mrn-green); border-color: var(--mrn-green); color: #fff; }
  button.danger { background: var(--mrn-red); border-color: var(--mrn-red); color: #fff; }
  button.blue { background: var(--mrn-blue); border-color: var(--mrn-blue); color: #fff; }
  button.icon { padding: 6px 10px; border-radius: 999px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px; }
  .card { background: var(--mrn-surface); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .card h3 { margin: 0; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--mrn-muted); }
  .battery { display: flex; align-items: center; gap: 14px; }
  .ring { position: relative; width: 112px; height: 112px; flex: none; }
  .ring svg { transform: rotate(-90deg); }
  .ring .val { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .ring .pct { font-size: 26px; font-weight: 700; line-height: 1; }
  .ring .km { font-size: 12px; color: var(--mrn-muted); margin-top: 4px; }
  .facts { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; font-size: 13px; }
  .facts span:nth-child(odd) { color: var(--mrn-muted); }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; font-size: 12px; background: var(--mrn-line); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--mrn-muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .seg { display: flex; border: 1px solid var(--mrn-line); border-radius: 10px; overflow: hidden; }
  .seg button { flex: 1; border: 0; border-radius: 0; background: transparent; }
  .seg button.on { background: var(--mrn-blue); color: #fff; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .row > button.grow { flex: 1; }
  .temp { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .temp .big { font-size: 30px; font-weight: 700; }
  .muted { color: var(--mrn-muted); font-size: 12px; }
  .sched { display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
  .sched .item { display: flex; justify-content: space-between; gap: 8px; border-top: 1px solid var(--mrn-line); padding-top: 6px; }
  .days { display: flex; gap: 3px; }
  .days b { width: 22px; height: 22px; border-radius: 6px; font-size: 11px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; background: var(--mrn-line); opacity: .45; }
  .days b.on { background: var(--mrn-green); color: #fff; opacity: 1; }
  .err { color: var(--mrn-red); font-size: 12px; }
  .toast { position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%); background: rgba(0,0,0,.8); color: #fff;
           padding: 6px 12px; border-radius: 8px; font-size: 12px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  .pulse { animation: pulse 1.6s infinite; }
  a { color: var(--mrn-blue); }
  [hidden] { display: none !important; }
  .wbfc { border-top: 1px solid var(--mrn-line); padding-top: 8px; display: flex; flex-direction: column; gap: 3px; }
  .wbfc-head { display: flex; justify-content: space-between; font-weight: 600; color: var(--mrn-amber); }
  #wbZl .temp { gap: 4px; }
  #wbZl .big { white-space: nowrap; font-size: 20px !important; }
  #wbZl button.icon { padding: 4px 8px; }
  .wbbar { height: 8px; border-radius: 999px; background: var(--mrn-line); overflow: hidden; }
  .wbbar span { display: block; height: 100%; width: 0; background: var(--mrn-amber); transition: width .6s; }
</style>

<div id="mrn">
  <div class="head">
    <div style="flex:1;min-width:0">
      <div class="title" id="model">Renault</div>
      <div class="sub" id="updated">–</div>
    </div>
    <button class="icon" id="btnRefresh" title="Jetzt aktualisieren" aria-label="Jetzt aktualisieren">⟳</button>
  </div>
  <div class="err" id="error" hidden></div>

  <div class="grid">
    <!-- Laden -->
    <div class="card">
      <h3>Laden</h3>
      <div class="battery">
        <div class="ring">
          <svg width="112" height="112" viewBox="0 0 112 112">
            <circle cx="56" cy="56" r="48" fill="none" stroke="currentColor" stroke-opacity=".15" stroke-width="10"/>
            <circle id="ringBar" cx="56" cy="56" r="48" fill="none" stroke="var(--mrn-green)" stroke-width="10"
                    stroke-linecap="round" stroke-dasharray="301.6" stroke-dashoffset="301.6" style="transition:stroke-dashoffset .6s"/>
          </svg>
          <div class="val"><div class="pct" id="pct">–</div><div class="km" id="km">– km</div></div>
        </div>
        <div style="display:flex;flex-direction:column;gap:8px;min-width:0">
          <div class="chips">
            <span class="chip"><span class="dot" id="plugDot"></span><span id="plugText">–</span></span>
            <span class="chip"><span class="dot" id="chargeDot"></span><span id="chargeText">–</span></span>
          </div>
          <div class="facts">
            <span>Leistung</span><span id="power">–</span>
            <span>Restzeit</span><span id="remaining">–</span>
            <span>Akku</span><span id="batTemp">–</span>
          </div>
        </div>
      </div>
      <div class="seg" role="group" aria-label="Lademodus">
        <button id="modeNow">Sofort laden</button>
        <button id="modeSched">Nach Zeitplan</button>
      </div>
      <div class="muted" id="modeHint" hidden></div>
      <div class="wbfc" id="wbZl" hidden>
        <div class="temp">
          <button class="icon" id="zlTMinus" aria-label="Ziel senken">−</button>
          <div style="text-align:center"><div class="big" id="zlTarget" style="font-size:22px">–</div><div class="muted">Ziel</div></div>
          <button class="icon" id="zlTPlus" aria-label="Ziel erhöhen">+</button>
          <button class="icon" id="zlDMinus" aria-label="Abfahrt früher">−</button>
          <div style="text-align:center"><div class="big" id="zlDep" style="font-size:22px">–</div><div class="muted">Abfahrt</div></div>
          <button class="icon" id="zlDPlus" aria-label="Abfahrt später">+</button>
        </div>
        <div class="muted" id="zlStatus"></div>
      </div>
      <div class="row">
        <button class="grow primary" id="btnCharge">Laden starten</button>
      </div>
    </div>

    <!-- Klima -->
    <div class="card">
      <h3>Klimatisierung</h3>
      <div class="temp">
        <button class="icon" id="tMinus" aria-label="Temperatur senken">−</button>
        <div style="text-align:center">
          <div class="big" id="target">21,0 °C</div>
          <div class="muted">Zieltemperatur</div>
        </div>
        <button class="icon" id="tPlus" aria-label="Temperatur erhöhen">+</button>
      </div>
      <div class="facts">
        <span>Außen</span><span id="outside">–</span>
        <span>Status</span><span id="hvacText">–</span>
      </div>
      <div class="row">
        <button class="grow blue" id="btnHvac">Vorklimatisieren</button>
      </div>
    </div>

    <!-- E3DC-Wallbox -->
    <div class="card" id="wbCard" hidden>
      <h3>Wallbox</h3>
      <div class="temp">
        <div>
          <div class="big" id="wbPower">–</div>
          <div class="muted">Ladeleistung</div>
        </div>
        <div style="text-align:right">
          <div class="big" id="wbSolarPct" style="font-size:22px">–</div>
          <div class="muted">Solaranteil</div>
        </div>
      </div>
      <div class="wbbar" aria-hidden="true"><span id="wbBarSolar"></span></div>
      <div class="chips" id="wbChips"></div>
      <div class="seg" id="wbModeSeg" role="group" aria-label="Wallbox-Lademodus">
        <button id="wbMode1"></button><button id="wbMode0"></button>
      </div>
      <div class="seg" id="wbPhaseSeg" role="group" aria-label="Phasen">
        <button id="wbPh1"></button><button id="wbPh0"></button>
      </div>
      <div class="facts">
        <span>Solar</span><span id="wbSolarPower">–</span>
        <span>Energie</span><span id="wbEnergy">–</span>
        <span>davon Solar</span><span id="wbSolarEnergy">–</span>
        <span>Status</span><span id="wbOnline">–</span>
      </div>
      <div class="wbfc" id="wbFc" hidden>
        <div class="wbfc-head"><span>☀ Solarprognose</span><span id="wbFcKwh">–</span></div>
        <div class="muted" id="wbFcWin">–</div>
        <div class="muted" id="wbFcText"></div>
      </div>
    </div>

    <!-- Zeitplan & Fahrzeug -->
    <div class="card">
      <h3 id="schedHead">Ladezeitplan</h3>
      <div class="sched" id="sched"><span class="muted">Kein Zeitplan</span></div>
      <h3 style="margin-top:4px">Fahrzeug</h3>
      <div class="facts">
        <span>Kilometer</span><span id="mileage">–</span>
        <span>Position</span><span id="pos">–</span>
        <span>VIN</span><span id="vin" style="word-break:break-all">–</span>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>
</div>

<script>
  var mrn = { targetTemp: 21 };
  var DAYS = [['monday','Mo'],['tuesday','Di'],['wednesday','Mi'],['thursday','Do'],['friday','Fr'],['saturday','Sa'],['sunday','So']];
  var CIRC = 2 * Math.PI * 48;

  function q(id) { return document.getElementById(id); }
  function num(v, d) { return (v === null || v === undefined || isNaN(v)) ? null : Number(v).toLocaleString('de-DE', { minimumFractionDigits: d, maximumFractionDigits: d }); }
  function fmt(v, d, unit) { var n = num(v, d); return n === null ? '–' : n + unit; }

  function toast(text) {
    var t = q('toast'); t.textContent = text; t.classList.add('show');
    clearTimeout(toast._t); toast._t = setTimeout(function () { t.classList.remove('show'); }, 2500);
  }

  // Sperre je Befehlsgruppe: das Fahrzeug weist neue Befehle ab, solange der vorige läuft (HTTP 409)
  var LOCK_MS = 90000;
  var locks = {};
  function locked(group) { return group && locks[group] && locks[group] > Date.now(); }

  function send(ident, value, msg, group, lockMs) {
    if (locked(group)) { toast('Vorheriger Befehl läuft noch …'); return; }
    if (typeof requestAction === 'function') { requestAction(ident, value); }
    else { console.log('requestAction', ident, value); }
    if (msg) toast(msg);
    if (group) {
      var ms = lockMs || LOCK_MS;
      locks[group] = Date.now() + ms;
      setTimeout(render, ms + 100);
      render();
    }
  }

  function utcToLocal(t) {
    var m = /(\d{2}):(\d{2})/.exec(t || '');
    if (!m) return t || '';
    var d = new Date(); d.setUTCHours(+m[1], +m[2], 0, 0);
    return d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
  }

  function renderSchedules(list) {
    var box = q('sched');
    var active = (list || []).filter(function (s) { return s && s.activated; });
    if (!active.length) { box.innerHTML = '<span class="muted">Kein aktiver Zeitplan</span>'; return; }
    box.innerHTML = '';
    active.forEach(function (s) {
      var first = null;
      var days = DAYS.map(function (d) {
        var on = s[d[0]] && s[d[0]].startTime;
        if (on && !first) first = s[d[0]];
        return '<b class="' + (on ? 'on' : '') + '">' + d[1] + '</b>';
      }).join('');
      var time = '';
      if (first) {
        var dur = +first.duration || 0;
        time = utcToLocal(first.startTime) + ' · ' + Math.floor(dur / 60) + ':' + String(dur % 60).padStart(2, '0') + ' h';
      }
      var el = document.createElement('div');
      el.className = 'item';
      el.innerHTML = '<div class="days">' + days + '</div><span>' + time + '</span>';
      box.appendChild(el);
    });
  }

  function render() {
    var d = mrn;
    q('model').textContent = d.model || 'Renault';
    q('updated').textContent = d.lastUpdate ? 'Stand ' + new Date(d.lastUpdate * 1000).toLocaleString('de-DE', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : 'Noch keine Daten';
    q('error').hidden = !d.error;
    q('error').textContent = d.error ? '⚠ ' + d.error : '';

    var pct = Math.max(0, Math.min(100, +d.battery || 0));
    q('pct').textContent = d.battery === null || d.battery === undefined ? '–' : pct + ' %';
    q('km').textContent = fmt(d.autonomy, 0, ' km');
    var bar = q('ringBar');
    bar.setAttribute('stroke-dasharray', CIRC.toFixed(1));
    bar.setAttribute('stroke-dashoffset', (CIRC * (1 - pct / 100)).toFixed(1));
    bar.setAttribute('stroke', pct < 20 ? 'var(--mrn-red)' : pct < 40 ? 'var(--mrn-amber)' : 'var(--mrn-green)');
    bar.classList.toggle('pulse', !!d.charging);

    q('plugText').textContent = d.plugText || '–';
    q('plugDot').style.background = d.plug === 1 ? 'var(--mrn-green)' : d.plug < 0 ? 'var(--mrn-red)' : 'var(--mrn-muted)';
    q('chargeText').textContent = d.chargeText || '–';
    q('chargeDot').style.background = d.chargeState === 10 ? 'var(--mrn-green)' : d.chargeState < 0 ? 'var(--mrn-red)' : (d.chargeState > 0 ? 'var(--mrn-amber)' : 'var(--mrn-muted)');
    q('power').textContent = d.charging ? fmt(d.power, 1, ' kW') : '–';
    var r = +d.remaining || 0;
    q('remaining').textContent = d.charging && r > 0 ? Math.floor(r / 60) + ' h ' + String(r % 60).padStart(2, '0') + ' min' : '–';
    q('batTemp').textContent = fmt(d.batteryTemp, 0, ' °C');

    // Mit Zielladen: Wahl "Sofort laden" / "Zielladen" (beide setzen den Fahrzeug-Lademodus auf Sofort); sonst Sofort / Zeitplan
    var zl = zlInfo();
    q('modeSched').textContent = zl ? 'Zielladen' : 'Nach Zeitplan';
    q('modeNow').classList.toggle('on', zl ? !zlActive(zl) : d.chargeMode !== 1);
    q('modeSched').classList.toggle('on', zl ? zlActive(zl) : d.chargeMode === 1);
    q('modeHint').hidden = !(zl && d.chargeMode === 1);
    q('modeHint').textContent = '⚠ Fahrzeug steht auf „Nach Zeitplan“ – mit Sofort laden oder Zielladen wird es umgestellt.';
    q('schedHead').hidden = q('sched').hidden = !!zl;

    var btnC = q('btnCharge');
    btnC.textContent = d.charging ? 'Laden stoppen' : 'Laden starten';
    btnC.className = 'grow ' + (d.charging ? 'danger' : 'primary');
    btnC.disabled = (d.plug !== 1 && !d.charging) || locked('charge');
    btnC.title = locked('charge') ? 'Befehl wird übertragen' : (btnC.disabled ? 'Fahrzeug ist nicht eingesteckt' : '');
    if (locked('charge')) btnC.textContent = 'Wird übertragen …';
    q('modeNow').disabled = q('modeSched').disabled = zl ? false : locked('mode');

    q('target').textContent = fmt(d.targetTemp, 1, ' °C');
    q('outside').textContent = fmt(d.outsideTemp, 1, ' °C');
    q('hvacText').textContent = d.hvac ? 'Läuft' : 'Aus';
    var btnH = q('btnHvac');
    btnH.textContent = d.hvac ? 'Klimatisierung stoppen' : 'Vorklimatisieren';
    btnH.className = 'grow ' + (d.hvac ? 'danger' : 'blue');

    if ((d.unsupported || []).indexOf('v1/charging-settings') >= 0) {
      q('sched').innerHTML = '<span class="muted">Vom Fahrzeug nicht unterstützt</span>';
    } else {
      renderSchedules(d.schedules);
    }
    q('mileage').textContent = fmt(d.mileage, 0, ' km');
    if (d.lat && d.lon) {
      var url = 'https://www.openstreetmap.org/?mlat=' + d.lat + '&mlon=' + d.lon + '#map=17/' + d.lat + '/' + d.lon;
      q('pos').innerHTML = '<a href="' + url + '" target="_blank" rel="noopener">Karte öffnen</a>';
    } else {
      q('pos').textContent = '–';
    }
    q('vin').textContent = d.vin || '–';
    renderWallbox(d.wallbox);
  }

  function chip(text, color) {
    return '<span class="chip"><span class="dot" style="background:' + color + '"></span>' + text + '</span>';
  }

  function renderBoolSeg(segId, prefix, info, group) {
    var seg = q(segId);
    seg.hidden = !info;
    if (!info) return;
    [0, 1].forEach(function (v) {
      var b = q(prefix + v);
      b.textContent = info.texts[v];
      b.classList.toggle('on', info.value === !!v);
      b.disabled = !info.actionable || locked(group);
      b.title = info.actionable ? '' : 'Variable hat keine Aktion';
    });
  }

  function renderWallbox(wb) {
    q('wbCard').hidden = !wb;
    if (!wb) { q('wbZl').hidden = true; return; }
    var p = wb.power, s = wb.solarPower;
    q('wbPower').textContent = p === null ? '–' : fmt(p / 1000, 1, ' kW');
    var share = (p > 50 && s !== null) ? Math.max(0, Math.min(100, Math.round(s / p * 100))) : null;
    q('wbSolarPct').textContent = share === null ? '–' : share + ' %';
    q('wbBarSolar').style.width = (share || 0) + '%';
    q('wbSolarPower').textContent = s === null ? '–' : fmt(s / 1000, 1, ' kW');
    q('wbEnergy').textContent = fmt(wb.energy, 2, ' kWh');
    q('wbSolarEnergy').textContent = fmt(wb.solarEnergy, 2, ' kWh');
    q('wbOnline').textContent = wb.online || '–';

    var chips = '';
    var c = wb.ctrl;
    if (c) {
      if (!c.available) chips += chip('Nicht verfügbar', 'var(--mrn-red)');
      chips += chip(c.plugged ? (c.locked ? 'Gesteckt · verriegelt' : 'Gesteckt') : 'Kein Fahrzeug', c.plugged ? 'var(--mrn-green)' : 'var(--mrn-muted)');
      if (c.blocked) chips += chip('Gesperrt', 'var(--mrn-red)');
      else if (c.charging || p > 50) chips += chip('Lädt', 'var(--mrn-green)');
      else if (c.plugged) chips += chip('Bereit', 'var(--mrn-amber)');
    } else if (p > 50) {
      chips += chip('Lädt', 'var(--mrn-green)');
    }
    q('wbChips').innerHTML = chips;

    var fc = wb.forecast;
    q('wbFc').hidden = !fc;
    if (fc) {
      var hm = function (t) { return new Date(t * 1000).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }); };
      q('wbFcKwh').textContent = fc.kwh === null ? '–' : 'heute ' + fmt(fc.kwh, 1, ' kWh');
      q('wbFcWin').textContent = (fc.start && fc.end && fc.kwh > 0 ? 'Fenster ' + hm(fc.start) + '–' + hm(fc.end) + ' Uhr' : 'Heute kein Solarfenster mehr')
        + (fc.tomorrow !== null ? ' · morgen ' + fmt(fc.tomorrow, 1, ' kWh') : '');
      q('wbFcText').textContent = fc.text || '';
    }

    renderBoolSeg('wbModeSeg', 'wbMode', wb.mode, 'wbmode');
    renderBoolSeg('wbPhaseSeg', 'wbPh', wb.phases, 'wbphases');
    renderTarget(wb.target);
  }

  // Zielladen: Ziel-% und Abfahrtsstunde, geschaltet über die Aktion der Variablen
  var zlPending = {};
  // Zielladen nutzbar, wenn Ziel und Aktiv-Schalter zugewiesen sind
  function zlInfo() {
    var t = mrn.wallbox && mrn.wallbox.target;
    return (t && t.active !== null) ? t : null;
  }
  // angezeigter Zustand: bis zur Rückmeldung der Variablen gilt die zuletzt getippte Wahl
  function zlActive(t) {
    if (zlPending.active !== undefined && zlPending.active === !!t.active) delete zlPending.active; // Rückmeldung angekommen
    return zlPending.active !== undefined ? zlPending.active : !!t.active;
  }
  function renderTarget(t) {
    q('wbZl').hidden = !t || !zlActive(t);
    if (!t) return;
    var ziel = zlPending.target !== undefined ? zlPending.target : t.target;
    var dep = zlPending.departure !== undefined ? zlPending.departure : t.departure;
    q('zlTarget').textContent = ziel + ' %';
    q('zlDep').textContent = dep === null ? '–' : String(dep).padStart(2, '0') + ':00';
    ['zlTMinus', 'zlTPlus'].forEach(function (id) { q(id).disabled = !t.actionable; });
    ['zlDMinus', 'zlDPlus'].forEach(function (id) { q(id).disabled = !t.actionable || dep === null; });
    q('zlStatus').textContent = t.status || '';
  }
  function stepTarget(key, delta) {
    var t = mrn.wallbox && mrn.wallbox.target;
    if (!t || !t.actionable) return;
    var r = key === 'target' ? t.targetRange : t.depRange;
    var cur = zlPending[key] !== undefined ? zlPending[key] : t[key];
    var v = +cur + delta * r[2];
    if (key === 'departure') v = ((v - r[0]) % (r[1] - r[0] + 1) + (r[1] - r[0] + 1)) % (r[1] - r[0] + 1) + r[0]; // Stunde rundum
    else v = Math.max(r[0], Math.min(r[1], v));
    zlPending[key] = v; render();
    clearTimeout(stepTarget['_' + key]);
    stepTarget['_' + key] = setTimeout(function () {
      send(key === 'target' ? 'WBZlTarget' : 'WBZlDeparture', v, key === 'target' ? 'Ziel ' + v + ' %' : 'Abfahrt ' + String(v).padStart(2, '0') + ':00');
      setTimeout(function () { delete zlPending[key]; render(); }, 3000);
    }, 700);
  }

  // Wird von IP-Symcon aufgerufen (UpdateVisualizationValue / initial)
  function handleMessage(data) {
    var d = typeof data === 'string' ? JSON.parse(data) : data;
    for (var k in d) { mrn[k] = d[k]; }
    render();
  }

  q('btnRefresh').onclick = function () { send('Refresh', true, 'Aktualisiere …'); };
  q('btnCharge').onclick = function () { send('Charging', !mrn.charging, mrn.charging ? 'Laden wird gestoppt …' : 'Laden wird gestartet …', 'charge'); };
  // ChargePlan: 0 = Sofort laden (Zielladen aus), 1 = Zielladen; das Modul stellt das Fahrzeug bei Bedarf auf Sofort
  // Ohne Sperre: Zielladen schaltet sofort, das Fahrzeug stellt das Modul danach im Hintergrund auf Sofort
  function choosePlan(v) {
    var zl = zlInfo();
    if (zlActive(zl) === !!v && mrn.chargeMode === 0) return;
    zlPending.active = !!v; render();
    send('ChargePlan', v, v ? 'Zielladen an' : 'Sofort laden');
    clearTimeout(choosePlan._t);
    choosePlan._t = setTimeout(function () { delete zlPending.active; render(); }, 15000);
  }
  q('modeNow').onclick = function () {
    if (zlInfo()) choosePlan(0);
    else if (mrn.chargeMode !== 0) send('ChargeMode', 0, 'Lademodus: Sofort', 'mode');
  };
  q('modeSched').onclick = function () {
    if (zlInfo()) choosePlan(1);
    else if (mrn.chargeMode !== 1) send('ChargeMode', 1, 'Lademodus: Zeitplan', 'mode');
  };
  q('btnHvac').onclick = function () { send('HvacStatus', !mrn.hvac, mrn.hvac ? 'Klimatisierung wird gestoppt …' : 'Klimatisierung auf ' + fmt(mrn.targetTemp, 1, ' °C') + ' …', 'hvac'); };
  [0, 1].forEach(function (v) {
    q('wbMode' + v).onclick = function () {
      var m = mrn.wallbox && mrn.wallbox.mode;
      var zl = zlInfo();
      if (m && m.value !== !!v) send('WBMode', !!v, 'Wallbox: ' + m.texts[v] + (zl && zlActive(zl) ? ' – Zielladen pausiert bis zur Abfahrt' : ''), 'wbmode', 10000);
    };
    q('wbPh' + v).onclick = function () {
      var ph = mrn.wallbox && mrn.wallbox.phases;
      if (ph && ph.value !== !!v) send('WBPhases', !!v, 'Wallbox: ' + ph.texts[v], 'wbphases', 10000);
    };
  });
  function stepTemp(delta) {
    var t = Math.max(16, Math.min(27, (+mrn.targetTemp || 21) + delta));
    mrn.targetTemp = t; render();
    clearTimeout(stepTemp._t);
    stepTemp._t = setTimeout(function () { send('TargetTemperature', t); }, 600);
  }
  q('zlTMinus').onclick = function () { stepTarget('target', -1); };
  q('zlTPlus').onclick = function () { stepTarget('target', 1); };
  q('zlDMinus').onclick = function () { stepTarget('departure', -1); };
  q('zlDPlus').onclick = function () { stepTarget('departure', 1); };
  q('tMinus').onclick = function () { stepTemp(-0.5); };
  q('tPlus').onclick = function () { stepTemp(0.5); };
</script>
